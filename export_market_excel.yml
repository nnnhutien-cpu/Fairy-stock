name: Export HOSE market data to Excel

on:
  schedule:
    # Chạy 16:30 giờ Việt Nam (UTC+7) các ngày thứ 2-6, sau khi thị trường đóng cửa.
    # Cron dùng giờ UTC -> 16:30 VN = 09:30 UTC.
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}  # cho phép bấm chạy tay từ tab Actions trên GitHub

permissions:
  contents: write

jobs:
  export-excel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run export script (sàn HOSE, 6 tháng)
        env:
          EXCHANGE: "HOSE"
          DAYS_BACK: "183"
          VNSTOCK_RATE_LIMIT: "18"
          OUTPUT_PATH: "data/market_export.xlsx"
        run: python scripts/export_market_excel.py

      - name: Commit & push file Excel mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_export.xlsx
          git diff --staged --quiet || git commit -m "chore: cập nhật dữ liệu thị trường HOSE (tự động)"
          git push
