<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{ --bg:#ffffff; --card:#ffffff; --card2:#f7f6fb; --line:#e6e2f0; --ink:#1f1a33; --text:#3b3552; --muted:#6b6585;
  --up:#16a34a; --down:#dc2626; --warn:#d97706; --blue:#2563eb; --acc:#7c3aed;
  --grad:linear-gradient(135deg,#5b21b6 0%,#7c3aed 55%,#8b5cf6 100%); --ease:cubic-bezier(.2,.7,.2,1); }
*{ box-sizing:border-box; }
html,body{ margin:0; overflow:hidden; background:transparent; color:var(--text); font-family:Sora,system-ui,sans-serif; font-size:14px; }
.wrap{ display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1.55fr); gap:14px; height:__H__px; }
.list{ display:flex; flex-direction:column; gap:8px; overflow:auto; padding-right:2px; }
.pk{ display:grid; grid-template-columns: 34px minmax(0,1fr) auto; align-items:center; gap:12px; cursor:pointer;
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 14px; position:relative; overflow:hidden;
  transition: transform .16s var(--ease), border-color .16s, background .16s; user-select:none; }
.pk::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c); }
.pk:hover{ transform: translateX(3px); border-color:#cfc6ee; }
.pk.on{ background: linear-gradient(90deg, rgba(124,58,237,.10), var(--card) 70%); border-color: var(--acc); }
.rk{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:800; color:var(--ink);
  background: rgba(124,58,237,.08); border:1px solid rgba(124,58,237,.25); font-size:.85rem; }
.pk.on .rk{ background:var(--grad); border-color:transparent; color:#fff; }
.tk{ white-space:nowrap; font-weight:800; font-size:1.08rem; letter-spacing:.05em; color:var(--ink); }
.sub{ font-size:.72rem; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip{ font-size:.62rem; font-weight:700; padding:1px 7px; border-radius:999px; margin-left:6px; vertical-align:2px; }
.chip.up{ background:rgba(22,163,74,.10); color:#15803d; } .chip.side{ background:rgba(217,119,6,.10); color:#b45309; }
.chip.down{ background:rgba(220,38,38,.10); color:#b91c1c; }
.act{ text-align:right; white-space:nowrap; }
.pct{ font-size:1.25rem; font-weight:800; color:var(--c); line-height:1; font-variant-numeric:tabular-nums; }
.lbl{ font-size:.62rem; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; }
.panel{ height:100%; overflow:hidden; background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:12px 14px 8px; display:flex; flex-direction:column; min-width:0; }
.ph{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.ph .big{ font-size:1.35rem; font-weight:800; color:var(--ink); letter-spacing:.05em; }
.ph .px{ font-size:1rem; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
.ph .kn{ font-size:.8rem; font-weight:700; color:var(--c); }
.leg{ display:flex; gap:12px; flex-wrap:wrap; font-size:.68rem; color:var(--muted); margin:4px 0 6px; font-variant-numeric:tabular-nums; }
.leg i{ display:inline-block; width:12px; height:2px; vertical-align:3px; margin-right:4px; }
#chart{ flex:1 1 0; min-height:0; position:relative; overflow:hidden; }
.why{ font-size:.74rem; color:var(--text); margin-top:6px; line-height:1.5; max-height:46px; overflow:auto; }
.fade{ animation: f .22s var(--ease); } @keyframes f{ from{opacity:.25} to{opacity:1} }
@media (max-width: 700px){
  .wrap{ grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); gap:10px; }
  .list{ flex-direction:row; overflow-x:auto; overflow-y:hidden; padding-bottom:4px; scroll-snap-type:x mandatory; }
  .pk{ min-width:150px; grid-template-columns: minmax(0,1fr) auto; padding:9px 12px; scroll-snap-align:start; }
  .pk .rk, .pk .sub{ display:none; }
  .why{ display:none; }
}
</style></head>
<body>
<div class="wrap">
  <div class="list" id="list"></div>
  <div class="panel" id="panel">
    <div class="ph" id="ph"></div>
    <div class="leg" id="leg"></div>
    <div id="chart"></div>
    <div class="why" id="why"></div>
  </div>
</div>
<script>
const D = __DATA__;
const TR = {TANG:["Tăng","up"], SIDEWAY:["Đi ngang","side"], GIAM:["Giảm","down"]};
const colorOf = r => r.pct >= 20 ? "var(--up)" : (r.label === "Thăm dò" ? "var(--blue)" : "var(--warn)");
const fmt = (x, d=2) => x == null ? "—" : x.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const list = document.getElementById("list");
D.forEach((r, i) => {
  const [tt, tc] = TR[r.trend] || ["—","side"];
  const el = document.createElement("div");
  el.className = "pk"; el.style.setProperty("--c", colorOf(r)); el.dataset.i = i;
  el.innerHTML = `<div class="rk">${i+1}</div>
    <div><div class="tk">${esc(r.ticker)}<span class="chip ${tc}">${tt}</span></div>
    <div class="sub">${fmt(r.close)} · K129 ${r.pct_vs_129>=0?"+":""}${r.pct_vs_129.toFixed(1)}% · RSI ${r.rsi==null?"—":r.rsi.toFixed(0)}</div></div>
    <div class="act"><div class="pct">${r.pct}%</div><div class="lbl">${esc(r.label)}</div></div>`;
  el.addEventListener("click", () => show(i));
  list.appendChild(el);
});

let chart, sC, sV, s129, s65, s17;
function initChart(){
  const box = document.getElementById("chart");
  chart = LightweightCharts.createChart(box, {
    width: box.clientWidth, height: box.clientHeight,
    layout: { background:{type:"solid", color:"transparent"}, textColor:"#6b6585", fontFamily:"Sora, sans-serif", fontSize:11 },
    grid: { vertLines:{color:"rgba(31,26,51,.06)"}, horzLines:{color:"rgba(31,26,51,.06)"} },
    rightPriceScale: { borderVisible:false, scaleMargins:{top:.08, bottom:.26} },
    timeScale: { borderVisible:false, rightOffset:3 },
    crosshair: { mode: 0 },
    localization: { locale: "vi-VN" },
    handleScroll: true, handleScale: true,
  });
  sC = chart.addCandlestickSeries({ upColor:"#16a34a", downColor:"#dc2626", borderVisible:false,
                                    wickUpColor:"#16a34a", wickDownColor:"#dc2626", priceLineVisible:false });
  s129 = chart.addLineSeries({ color:"#d97706", lineWidth:3, priceLineVisible:false, lastValueVisible:false });
  s65  = chart.addLineSeries({ color:"#3987e5", lineWidth:2, priceLineVisible:false, lastValueVisible:false });
  s17  = chart.addLineSeries({ color:"#d55181", lineWidth:1, lineStyle:2, priceLineVisible:false, lastValueVisible:false });
  sV = chart.addHistogramSeries({ priceScaleId:"v", priceFormat:{type:"volume"}, priceLineVisible:false, lastValueVisible:false });
  new ResizeObserver(() => chart.applyOptions({ width: box.clientWidth, height: box.clientHeight })).observe(box);
  chart.priceScale("v").applyOptions({ scaleMargins:{top:.8, bottom:0} });
  chart.subscribeCrosshairMove(p => {
    const b = p && p.time && p.seriesData.get(sC);
    legend(b ? b : null);
  });
}
let cur = 0;
function line(S, key){ return S.t.map((t, j) => S[key][j] == null ? {time:t} : {time:t, value:S[key][j]}); }
function legend(b){
  const S = D[cur].series, j = S.t.length - 1;
  const o = b ? b.open : S.o[j], h = b ? b.high : S.h[j], l = b ? b.low : S.l[j], c = b ? b.close : S.c[j];
  document.getElementById("leg").innerHTML =
    `<span>O ${fmt(o)} · H ${fmt(h)} · L ${fmt(l)} · C <b style="color:var(--ink)">${fmt(c)}</b></span>
     <span><i style="background:#d97706"></i>Knife129</span><span><i style="background:#3987e5"></i>Knife65</span>
     <span><i style="background:#d55181"></i>Kijun17</span>`;
}
function show(i){
  cur = i;
  [...list.children].forEach((el, k) => el.classList.toggle("on", k === i));
  const r = D[i], S = r.series, c = colorOf(r);
  const panel = document.getElementById("panel"); panel.style.setProperty("--c", c);
  document.getElementById("ph").innerHTML =
    `<span class="big">${esc(r.ticker)}</span><span class="px">${fmt(r.close)}</span><span class="kn">${esc(r.khuyen_nghi)}</span>`;
  document.getElementById("why").innerHTML =
    `<b style="color:var(--ink)">${esc(r.mo_ta)}</b>` + (r.ly_do.length ? "<br>" + r.ly_do.map(esc).join(" · ") : "");
  sC.setData(S.t.map((t, j) => ({time:t, open:S.o[j], high:S.h[j], low:S.l[j], close:S.c[j]})));
  sV.setData(S.t.map((t, j) => ({time:t, value:S.v[j],
    color: S.c[j] >= S.o[j] ? "rgba(22,163,74,.35)" : "rgba(220,38,38,.35)"})));
  s129.setData(line(S, "k129")); s65.setData(line(S, "k65")); s17.setData(line(S, "k17"));
  chart.timeScale().fitContent();
  legend(null);
  panel.classList.remove("fade"); void panel.offsetWidth; panel.classList.add("fade");
}
if (window.LightweightCharts && D.length){ initChart(); show(0); }
else if (D.length){ document.getElementById("chart").innerHTML = '<div style="padding:20px;color:#6b6585">Không tải được thư viện biểu đồ.</div>'; }
</script>
</body></html>
