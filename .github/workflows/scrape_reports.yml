name: Scrape Analyst Reports

on:
  schedule:
    - cron: "0 3 * * 1-5"   # 10:00 SA giờ VN (UTC+7), thứ 2-6 (sau giờ mở cửa)
    - cron: "30 8 * * 1-5"  # 15:30 CH giờ VN, sau đóng cửa
  workflow_dispatch:          # Cho phép chạy thủ công từ GitHub UI

concurrency:
  group: scrape-reports
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write         # Cần để commit reports.json lên repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python bot_reports.py

      - name: Commit reports.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json
          if git diff --staged --quiet; then
            echo "reports.json không đổi, bỏ qua commit"
            exit 0
          fi
          git commit -m "auto: cập nhật reports.json $(date +'%Y-%m-%d %H:%M')"
          # SỬA: bản cũ chạy "git pull --rebase" khi reports.json đang bị sửa chưa commit
          # -> lỗi "cannot pull with rebase: You have unstaged changes". Nay commit trước rồi mới pull.
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then echo "Push thành công (lần $i)"; exit 0; fi
            echo "Retry lần $i..."
            sleep 5
          done
          echo "Push thất bại sau 3 lần"
          exit 1
