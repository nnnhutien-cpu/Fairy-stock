name: Bot Cao Data 17h (T2-T6)

on:
  schedule:
    # ICT = UTC+7. GitHub cron thường trễ 5-30 phút nên đặt thêm mốc dự phòng.
    # bot_cdata.py ghi đè toàn bộ sheet mỗi lần chạy nên chạy lại nhiều lần vẫn an toàn.
    - cron: '30 10 * * 1-5'  # 17:30 ICT (chạy chính)
    - cron: '30 11 * * 1-5'  # 18:30 ICT (dự phòng nếu TCBS chưa có giá đóng cửa)
  workflow_dispatch: # Nút cho phép bạn bấm chạy thủ công để test

concurrency:
  group: bot-cao-data
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: "1"
    steps:
    - name: Keo code tu kho ve
      uses: actions/checkout@v4

    - name: Cai dat Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cai dat thu vien
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy gspread oauth2client requests tqdm

    - name: Tao file Credentials
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json

    - name: Chay Bot
      run: python bot_cdata.py

    - name: Xoa file Credentials
      if: always()
      run: rm -f credentials.json
