name: Scan Breadth HOSE

on:
  schedule:
    - cron: "0 3 * * 1-5"    # 10:00 sáng giờ VN (UTC+7), thứ 2-6
    - cron: "30 8 * * 1-5"   # 15:30 chiều giờ VN, thứ 2-6
  workflow_dispatch: {}       # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Chạy quét Breadth 400 mã HOSE
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scan_breadth_daily.py

      - name: Commit kết quả về repo
        run: |
          git config user.name "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add breadth_latest.json breadth_history.json
          git diff --quiet --cached || git commit -m "Cập nhật Breadth Score $(date +'%Y-%m-%d %H:%M')"
          git push
