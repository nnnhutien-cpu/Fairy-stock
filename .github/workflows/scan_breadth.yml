name: Scan Breadth HOSE
on:
  schedule:
    # ICT = UTC+7. Phiên chiều đóng cửa 15:00, ATC ~15:30.
    # Nguồn giá: TCBS. GitHub cron thường trễ 5-30 phút nên đặt 3 mốc dự phòng:
    # - 17:30 ICT = 10:30 UTC (chạy chính)
    # - 18:30 ICT = 11:30 UTC (dự phòng 1)
    # - 20:00 ICT = 13:00 UTC (dự phòng 2, chốt sổ trong ngày)
    - cron: '30 10 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: "true = quét bất kể giờ giấc / đã có dữ liệu (để test)"
        required: false
        default: "false"
concurrency:
  group: scan-breadth-hose
  cancel-in-progress: false
permissions:
  contents: write
  actions: write   # để tự bật lại lịch chạy nếu GitHub tắt (repo ít hoạt động ~60 ngày)
jobs:
  scan:
    name: Quét Sức Khỏe Thị Trường HOSE (EOD)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: "1"
      DATA_SOURCE: tcbs
      FORCE_SCAN: ${{ github.event.inputs.force }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Giữ lịch chạy luôn bật: nếu GitHub từng tắt, lượt chạy tay/lượt này sẽ bật lại.
      - name: Giữ lịch chạy luôn bật
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable "Scan Breadth HOSE" --repo "${{ github.repository }}" || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests pandas

      - name: Kiểm tra kết nối nguồn TCBS
        run: |
          echo "=========================================="
          echo "🔍 KIỂM TRA NGUỒN GIÁ TCBS"
          echo "=========================================="
          NOW_TS=$(date +%s)
          URL="https://apipubaws.tcbs.com.vn/stock-insight/v1/stock/bars-long-term?ticker=VNINDEX&type=index&resolution=D&to=${NOW_TS}&countBack=3"
          RESP=$(curl -s --max-time 20 -H "User-Agent: Mozilla/5.0" "$URL" || true)
          if [ -z "$RESP" ]; then
            echo "⚠️  Không gọi được TCBS (timeout/chặn IP) — bot sẽ tự thử lại ở lượt sau"
          else
            echo "✅ TCBS phản hồi. Phiên mới nhất: $(echo "$RESP" | grep -o '"tradingDate":"[^"]*"' | tail -1)"
          fi
          echo "=========================================="

      # Quyết định có chạy hay không (đã qua giờ đóng cửa? đã có dữ liệu phiên đó chưa?)
      # nằm trong breadth_scanner.py. Lỗi thật sẽ trả mã thoát 1 -> workflow đỏ.
      - name: Quét Market Breadth (EOD)
        run: python breadth_scanner.py

      - name: Commit breadth.json vào repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add breadth.json
          if git diff --staged --quiet; then
            echo "📝 breadth.json không đổi, bỏ qua commit"
            exit 0
          fi
          git commit -m "🤖 Auto: cập nhật breadth.json (EOD) $(date '+%Y-%m-%d %H:%M ICT')"
          for i in 1 2 3; do
            if git push origin main; then
              echo "✅ Push thành công (lần $i)"
              exit 0
            fi
            echo "⚠️ Push thất bại lần $i, pull rebase lại rồi retry..."
            git pull --rebase origin main
            sleep 3
          done
          echo "❌ Push thất bại sau 3 lần — báo lỗi đỏ để không bị bỏ sót"
          exit 1
