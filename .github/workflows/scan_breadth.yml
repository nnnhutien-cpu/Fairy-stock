name: Scan Breadth HOSE

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 17:30 ICT
    - cron: "30 11 * * 1-5"   # 18:30 ICT (du phong)
    - cron: "0 13 * * 1-5"    # 20:00 ICT (du phong cuoi)
  workflow_dispatch:
    inputs:
      force:
        description: "true = quet bat ke gio giac / da co du lieu (de test)"
        required: false
        default: "false"

concurrency:
  group: scan-breadth-hose
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scan:
    name: Quet Suc Khoe Thi Truong HOSE (EOD)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: "1"
      DATA_SOURCE: tcbs
      # Khi chay theo lich, github.event.inputs.force la rong -> mac dinh "false"
      FORCE_SCAN: ${{ github.event.inputs.force || 'false' }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Kiem tra file can thiet co trong repo
        run: |
          for f in breadth_scanner.py requirements.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::Thieu file $f trong repo (chua commit hoac sai ten/thu muc)"
              ls -la
              exit 1
            fi
          done

      - name: Giu lich chay luon bat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable "Scan Breadth HOSE" --repo "${{ github.repository }}" || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests pandas pytz
          echo "Python: $(python --version)"
          echo "--- Chan doan vnstock tren PyPI ---"
          pip index versions vnstock || true
          pip install vnstock || echo "::warning::Khong cai duoc vnstock tu PyPI (xem log chan doan o tren)"
          python -c "import vnstock; print('vnstock OK')" || echo "::warning::Khong import duoc vnstock - breadth_scanner.py phai chay duoc khi khong co vnstock"

      - name: Kiem tra ket noi nguon TCBS
        run: |
          NOW_TS=$(date +%s)
          URL="https://apipubaws.tcbs.com.vn/stock-insight/v1/stock/bars-long-term?ticker=VNINDEX&type=index&resolution=D&to=${NOW_TS}&countBack=3"
          CODE=$(curl -s --max-time 20 -o /tmp/tcbs.json -w "%{http_code}" -H "User-Agent: Mozilla/5.0" "$URL" || echo "000")
          echo "TCBS HTTP status: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Phien moi nhat: $(grep -o '"tradingDate":"[^"]*"' /tmp/tcbs.json | tail -1)"
          else
            echo "::warning::TCBS tra ve $CODE (000=timeout, 403/429=bi chan IP hoac gioi han toc do). Bot se dung nguon du phong neu co."
          fi

      - name: Quet Market Breadth (EOD)
        run: python breadth_scanner.py

      - name: Commit breadth.json vao repo
        run: |
          if [ ! -f breadth.json ]; then
            echo "::error::breadth_scanner.py chay xong nhung khong tao ra breadth.json"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add breadth.json
          if git diff --staged --quiet; then echo "breadth.json khong doi, bo qua commit"; exit 0; fi
          git commit -m "Auto: cap nhat breadth.json (EOD) $(date '+%Y-%m-%d %H:%M ICT')"
          for i in 1 2 3; do
            if git push origin main; then echo "Push thanh cong (lan $i)"; exit 0; fi
            echo "Push that bai lan $i, pull rebase roi retry..."
            git pull --rebase origin main
            sleep 3
          done
          echo "::error::Push that bai sau 3 lan (kiem tra branch protection / quyen ghi cua Actions)"
          exit 1
