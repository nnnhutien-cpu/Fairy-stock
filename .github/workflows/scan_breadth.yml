name: Scan Breadth HOSE

on:
  schedule:
    # Chạy mỗi 15 phút, Thứ 2–6, 2h–8h UTC (= 9h–15h ICT)
    - cron: '0,15,30,45 2,3,4,5,6,7,8 * * 1-5'
  workflow_dispatch:   # Cho phép chạy thủ công từ GitHub UI

# ✅ KEY FIX: Chỉ cho 1 job chạy cùng lúc — tránh 2 job tranh nhau push
concurrency:
  group: scan-breadth-hose
  cancel-in-progress: true   # Job cũ bị cancel ngay khi job mới trigger

permissions:
  contents: write   # Cần để push breadth.json về repo

jobs:
  scan:
    name: Quét Sức Khỏe Thị Trường HOSE
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history để git pull --rebase không bị lỗi
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Kiểm tra giờ giao dịch (ICT)
        id: check_time
        run: |
          HOUR=$(TZ='Asia/Ho_Chi_Minh' date +%H)
          MIN=$(TZ='Asia/Ho_Chi_Minh' date +%M)
          DOW=$(TZ='Asia/Ho_Chi_Minh' date +%u)   # 1=T2 ... 7=CN
          echo "🕒 ICT: ${HOUR}:${MIN}, Thứ: ${DOW}"

          RUN=false
          if [ "$DOW" -le 5 ]; then
            if   { [ "$HOUR" -ge 9  ] && [ "$HOUR" -lt 11 ]; } \
              || { [ "$HOUR" -eq 11 ] && [ "$MIN"  -le 30  ]; } \
              || { [ "$HOUR" -ge 13 ] && [ "$HOUR" -lt 15  ]; } \
              || { [ "$HOUR" -eq 15 ] && [ "$MIN"  -le 40  ]; }; then
              RUN=true
            fi
          fi

          # workflow_dispatch luôn cho chạy
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
            echo "⚡ Manual trigger — bỏ qua kiểm tra giờ"
          fi

          echo "run=${RUN}" >> $GITHUB_OUTPUT
          echo "Kết quả: run=${RUN}"

      - name: Quét Market Breadth
        if: steps.check_time.outputs.run == 'true'
        run: |
          echo "🚀 Bắt đầu: $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S ICT')"
          python market_breadth.py
          echo "✅ Xong: $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S ICT')"

      - name: Commit breadth.json vào repo
        if: steps.check_time.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add breadth.json

          # Không có gì thay đổi thì thôi
          if git diff --staged --quiet; then
            echo "📝 breadth.json không đổi, bỏ qua commit"
            exit 0
          fi

          git commit -m "🤖 Auto: cập nhật breadth.json $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M ICT')"

          # ✅ KEY FIX: pull --rebase trước khi push để tránh rejected
          # Retry tối đa 3 lần phòng race condition hiếm gặp
          for i in 1 2 3; do
            git pull --rebase origin main && git push && echo "✅ Push thành công (lần $i)" && break
            echo "⚠️ Push lần $i thất bại, thử lại sau 5 giây..."
            sleep 5
          done
