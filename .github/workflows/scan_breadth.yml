name: Scan Breadth HOSE

on:
  schedule:
    - cron: '0,15,30,45 2,3,4,5,6,7,8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: scan-breadth-hose
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    name: Quét Sức Khỏe Thị Trường HOSE
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Kiểm tra giờ giao dịch (ICT)
        id: check_time
        run: |
          HOUR=$(TZ='Asia/Ho_Chi_Minh' date +%H)
          MIN=$(TZ='Asia/Ho_Chi_Minh' date +%M)
          DOW=$(TZ='Asia/Ho_Chi_Minh' date +%u)
          echo "🕒 ICT: ${HOUR}:${MIN}, Thứ: ${DOW}"

          RUN=false
          if [ "$DOW" -le 5 ]; then
            if   { [ "$HOUR" -ge 9  ] && [ "$HOUR" -lt 11 ]; } \
              || { [ "$HOUR" -eq 11 ] && [ "$MIN"  -le 30  ]; } \
              || { [ "$HOUR" -ge 13 ] && [ "$HOUR" -lt 15  ]; } \
              || { [ "$HOUR" -eq 15 ] && [ "$MIN"  -le 40  ]; }; then
              RUN=true
            fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          fi

          echo "run=${RUN}" >> $GITHUB_OUTPUT

      - name: Quét Market Breadth
        if: steps.check_time.outputs.run == 'true'
        run: python market_breadth.py

      # ✅ Pull TRƯỚC khi add/commit/push — đây là fix chính
      - name: Commit breadth.json vào repo
        if: steps.check_time.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bước 1: Pull rebase TRƯỚC để sync với remote
          git pull --rebase origin main

          # Bước 2: Stage file sau khi đã rebase
          git add breadth.json

          # Bước 3: Bỏ qua nếu không có gì thay đổi
          if git diff --staged --quiet; then
            echo "📝 breadth.json không đổi, bỏ qua commit"
            exit 0
          fi

          # Bước 4: Commit
          git commit -m "🤖 Auto: cập nhật breadth.json $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M ICT')"

          # Bước 5: Push với retry phòng race condition hiếm gặp
          for i in 1 2 3; do
            if git push origin main; then
              echo "✅ Push thành công (lần $i)"
              break
            fi
            echo "⚠️ Push thất bại lần $i, pull rebase lại rồi retry..."
            git pull --rebase origin main
            sleep 3
          done
