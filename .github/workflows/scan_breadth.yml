# Nội dung giữ nguyên logic bản cũ; chỉ viết lại từ 1 dòng JSON sang YAML dễ đọc/sửa,
# và cài thêm vnstock + pytz (breadth_scanner.py import vnstock để lấy danh sách mã).
name: Scan Breadth HOSE

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 17:30 ICT
    - cron: "30 11 * * 1-5"   # 18:30 ICT (dự phòng)
    - cron: "0 13 * * 1-5"    # 20:00 ICT (dự phòng cuối)
  workflow_dispatch:
    inputs:
      force:
        description: "true = quet bat ke gio giac / da co du lieu (de test)"
        required: false
        default: "false"

concurrency:
  group: scan-breadth-hose
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scan:
    name: Quet Suc Khoe Thi Truong HOSE (EOD)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: "1"
      DATA_SOURCE: tcbs
      FORCE_SCAN: ${{ github.event.inputs.force }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Giu lich chay luon bat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable "Scan Breadth HOSE" --repo "${{ github.repository }}" || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests pandas vnstock pytz

      - name: Kiem tra ket noi nguon TCBS
        run: |
          NOW_TS=$(date +%s)
          URL="https://apipubaws.tcbs.com.vn/stock-insight/v1/stock/bars-long-term?ticker=VNINDEX&type=index&resolution=D&to=${NOW_TS}&countBack=3"
          RESP=$(curl -s --max-time 20 -H "User-Agent: Mozilla/5.0" "$URL" || true)
          if [ -z "$RESP" ]; then
            echo "Khong goi duoc TCBS (timeout/chan IP) - bot se tu thu lai o luot sau"
          else
            echo "TCBS phan hoi. Phien moi nhat: $(echo "$RESP" | grep -o '"tradingDate":"[^"]*"' | tail -1)"
          fi

      - name: Quet Market Breadth (EOD)
        run: python breadth_scanner.py

      - name: Commit breadth.json vao repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add breadth.json
          if git diff --staged --quiet; then echo "breadth.json khong doi, bo qua commit"; exit 0; fi
          git commit -m "Auto: cap nhat breadth.json (EOD) $(date '+%Y-%m-%d %H:%M ICT')"
          for i in 1 2 3; do
            if git push origin main; then echo "Push thanh cong (lan $i)"; exit 0; fi
            echo "Push that bai lan $i, pull rebase roi retry..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Push that bai sau 3 lan"
          exit 1
