# .github/workflows/scan_breadth.yml
name: Scan Breadth Daily

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 8:30 SA giờ VN (UTC+7)
    - cron: '30 8 * * 1-5'   # 15:30 CH giờ VN
  workflow_dispatch:           # chạy thủ công được

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install vnstock pandas requests

      - name: Run breadth scan
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scan_breadth_daily.py

      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add breadth_latest.json breadth_history.json
          git diff --staged --quiet || git commit -m "chore: update breadth data"
          git push
