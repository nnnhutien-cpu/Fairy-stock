name: Scan Breadth HOSE

on:
  workflow_dispatch: {}       # cho phép bấm "Run workflow" thủ công trên GitHub
  schedule:
    # 08:40 UTC = 15:40 giờ VN (~40 phút sau khi HOSE đóng cửa phiên chiều)
    - cron: "40 8 * * 1-5"    # Thứ 2 - Thứ 6

permissions:
  contents: write   # cần quyền ghi để commit breadth.json ngược lại repo

jobs:
  scan-breadth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install vnstock pandas

      - name: Chạy quét breadth
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python breadth_scanner.py

      - name: Commit breadth.json vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add breadth.json
          git commit -m "🤖 Auto: cập nhật breadth.json" || echo "Không có gì thay đổi, bỏ qua commit"
          git push
