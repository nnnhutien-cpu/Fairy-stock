name: Scan Breadth HOSE
on:
  schedule:
    # UTC+7 = ICT. Phiên chiều đóng cửa 15:00, ATC ~15:30.
    # LƯU Ý: thử nghiệm thực tế cho thấy chạy lúc 16:56 ICT vẫn CHƯA ĐỦ — các
    # nguồn dữ liệu (vnstock/DNSE/FireAnt/Yahoo) đôi khi trễ vài tiếng mới có
    # giá đóng cửa chính thức của phiên. Vì vậy đẩy lịch trễ hơn hẳn:
    # - 17:30 ICT = 10:30 UTC (chạy chính)
    # - 18:30 ICT = 11:30 UTC (dự phòng, nếu nguồn vẫn trễ ở lần chạy đầu)
    - cron: '30 10 * * 1-5'
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: "true = quét bất kể giờ giấc (để test)"
        required: false
        default: "false"
concurrency:
  group: scan-breadth-hose
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  scan:
    name: Quét Sức Khỏe Thị Trường HOSE (EOD)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Ho_Chi_Minh
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      FORCE_SCAN: ${{ github.event.inputs.force }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Debug - Kiểm tra secret
        run: |
          echo "=========================================="
          echo "🔍 KIỂM TRA VNSTOCK_API_KEY"
          echo "=========================================="
          if [ -z "$VNSTOCK_API_KEY" ]; then
            echo "⚠️  VNSTOCK_API_KEY TRỐNG — bot sẽ chạy không có API key (rate limit 18/phút)"
            echo "   → Nếu muốn tăng tốc: GitHub → Settings → Secrets → Actions → thêm VNSTOCK_API_KEY"
          else
            echo "✅ VNSTOCK_API_KEY đã truyền (dài ${#VNSTOCK_API_KEY} ký tự)"
          fi
          echo "=========================================="
      # Không còn bước "Kiểm tra giờ giao dịch" phức tạp — logic quyết định
      # có chạy hay không (đã qua giờ đóng cửa? đã quét gần đây chưa?) nằm
      # trong chính breadth_scanner.py để dễ bảo trì và test bằng workflow_dispatch.
      - name: Quét Market Breadth (EOD)
        run: python breadth_scanner.py
      - name: Commit breadth.json vào repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add breadth.json
          if git diff --staged --quiet; then
            echo "📝 breadth.json không đổi, bỏ qua commit"
            exit 0
          fi
          git commit -m "🤖 Auto: cập nhật breadth.json (EOD) $(date '+%Y-%m-%d %H:%M ICT')"
          for i in 1 2 3; do
            if git push origin main; then
              echo "✅ Push thành công (lần $i)"
              break
            fi
            echo "⚠️ Push thất bại lần $i, pull rebase lại rồi retry..."
            git pull --rebase origin main
            sleep 3
          done
