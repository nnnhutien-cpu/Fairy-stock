name: Scan Breadth HOSE

on:
  workflow_dispatch: {}       # chạy tay khi cần — luôn quét ngay, bỏ qua kiểm tra giờ/debounce
  schedule:
    # GitHub Actions chỉ đảm bảo cron chạy theo kiểu "best-effort": lịch có
    # thể bị TRỄ hoặc BỎ QUA hoàn toàn, đặc biệt vào đúng phút tròn giờ/nửa
    # giờ (:00, :30 — giờ cao điểm toàn cầu). Để bù lại, ta lên lịch DÀY hơn
    # (mỗi 10 phút, lệch phút khỏi mốc tròn) nhằm tăng cơ hội ít nhất 1 lượt
    # "lọt" mỗi ~30 phút. Bản thân breadth_scanner.py sẽ tự bỏ qua nếu đang
    # ngoài giờ giao dịch HOẶC vừa quét cách đây chưa tới 25 phút — nên lịch
    # dày này KHÔNG làm quét trùng lặp hay tốn thêm API.
    - cron: "3,13,23,33,43,53 2-8 * * 1-5"

# Không huỷ job đang chạy dở khi có lượt kích hoạt mới — chỉ xếp hàng, vì thời
# gian quét có thể kéo dài hơn dự kiến (rate limit vnstock) và ta không muốn
# mất dữ liệu giữa chừng.
concurrency:
  group: scan-breadth-hose
  cancel-in-progress: false

permissions:
  contents: write   # cần quyền ghi để commit breadth.json ngược lại repo

jobs:
  scan-breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # chặn trường hợp job treo vô thời hạn, chiếm hàng đợi
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install vnstock pandas

      - name: Chạy quét breadth
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          # workflow_dispatch (bấm tay) -> luôn quét ngay bất kể giờ giấc/debounce
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python breadth_scanner.py

      - name: Commit breadth.json vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add breadth.json
          git commit -m "🤖 Auto: cập nhật breadth.json" || echo "Không có gì thay đổi, bỏ qua commit"
          git push
