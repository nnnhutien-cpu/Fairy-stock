name: Scan Breadth HOSE

on:
  workflow_dispatch: {}       # vẫn cho phép bấm "Run workflow" thủ công khi cần
  schedule:
    # Tự động quét mỗi 30 phút trong giờ giao dịch (giờ VN, UTC+7), bỏ qua
    # giờ nghỉ trưa (11h30-13h00, HOSE đóng cửa nên không cần quét):
    - cron: "0,30 2-4 * * 1-5"   # 09:00 - 11:30 (phiên sáng)
    - cron: "0,30 6-8 * * 1-5"   # 13:00 - 15:30 (phiên chiều)
    # Quét chốt phiên lúc 15:40 (giữ nguyên như cũ) để lấy số liệu đã settle
    - cron: "40 8 * * 1-5"

# Đảm bảo không có 2 lượt quét chạy chồng nhau (mỗi lượt ~5-10 phút, cách nhau
# 30 phút nên bình thường không đụng nhau, nhưng nếu 1 lượt bị treo/chạy chậm
# thì huỷ lượt cũ, ưu tiên số liệu MỚI NHẤT — tránh xung đột khi commit
# breadth.json ngược lại repo).
concurrency:
  group: scan-breadth-hose
  cancel-in-progress: true

permissions:
  contents: write   # cần quyền ghi để commit breadth.json ngược lại repo

jobs:
  scan-breadth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install vnstock pandas

      - name: Chạy quét breadth
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python breadth_scanner.py

      - name: Commit breadth.json vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add breadth.json
          git commit -m "🤖 Auto: cập nhật breadth.json" || echo "Không có gì thay đổi, bỏ qua commit"
          git push
