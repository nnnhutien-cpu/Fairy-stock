name: Scan Breadth HOSE

on:
  schedule:
    - cron: '0,15,30,45 2,3,4,5,6,7,8 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: "true = quét cả ngoài giờ giao dịch (để test)"
        required: false
        default: "false"

concurrency:
  group: scan-breadth-hose
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    name: Quét Sức Khỏe Thị Trường HOSE
    runs-on: ubuntu-latest
    timeout-minutes: 35    # ✅ TĂNG từ 20 → 35 phút

    env:
      TZ: Asia/Ho_Chi_Minh
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}   # ✅ TRUYỀN VÀO TẤT CẢ STEPS
      FORCE_SCAN: ${{ github.event.inputs.force }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ✅ THÊM BƯỚC DEBUG: kiểm tra secret có tới runner không
      - name: Debug - Kiểm tra secret
        run: |
          echo "=========================================="
          echo "🔍 KIỂM TRA VNSTOCK_API_KEY"
          echo "=========================================="
          if [ -z "$VNSTOCK_API_KEY" ]; then
            echo "❌ VNSTOCK_API_KEY TRỐNG"
            echo "   → Kiểm tra GitHub repo → Settings → Secrets → Actions"
            echo "   → Đảm bảo có secret tên chính xác: VNSTOCK_API_KEY"
            exit 1
          else
            echo "✅ VNSTOCK_API_KEY đã truyền (dài ${#VNSTOCK_API_KEY} ký tự)"
          fi
          echo "=========================================="

      - name: Kiểm tra giờ giao dịch (ICT)
        id: check_time
        run: |
          HOUR=$(date +%H)
          MIN=$(date +%M)
          DOW=$(date +%u)
          echo "🕒 ICT: ${HOUR}:${MIN}, Thứ: ${DOW}"

          RUN=false
          if [ "$DOW" -le 5 ]; then
            if   { [ "$HOUR" -ge 9  ] && [ "$HOUR" -lt 11 ]; } \
              || { [ "$HOUR" -eq 11 ] && [ "$MIN"  -le 30  ]; } \
              || { [ "$HOUR" -ge 13 ] && [ "$HOUR" -lt 15  ]; } \
              || { [ "$HOUR" -eq 15 ] && [ "$MIN"  -le 40  ]; }; then
              RUN=true
            fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          fi

          echo "run=${RUN}" >> $GITHUB_OUTPUT

      - name: Quét Market Breadth
        if: steps.check_time.outputs.run == 'true'
        run: python breadth_scanner.py

      - name: Commit breadth.json vào repo
        if: steps.check_time.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main
          git add breadth.json

          if git diff --staged --quiet; then
            echo "📝 breadth.json không đổi, bỏ qua commit"
            exit 0
          fi

          git commit -m "🤖 Auto: cập nhật breadth.json $(date '+%Y-%m-%d %H:%M ICT')"

          for i in 1 2 3; do
            if git push origin main; then
              echo "✅ Push thành công (lần $i)"
              break
            fi
            echo "⚠️ Push thất bại lần $i, pull rebase lại rồi retry..."
            git pull --rebase origin main
            sleep 3
          done
