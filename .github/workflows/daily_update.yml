name: 🤖 Daily Update (DNSE API)

on:
  schedule:
    # 17:30 giờ VN = 10:30 UTC, thứ 2-6
    - cron: "30 10 * * 1-5"
  workflow_dispatch:   # chạy thủ công từ GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # cần để commit CSV lên repo

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: pip install requests pandas

      - name: 🚀 Run daily update (DNSE API)
        run: python daily_update.py

      - name: 💾 Commit CSV lên repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock_prices.csv
          git diff --staged --quiet || git commit -m "🤖 Auto-update stock_prices.csv $(date +'%Y-%m-%d')"
          git push
