# Đặt file này vào: <repo>/.github/workflows/daily_update.yml
#
# Trước khi chạy, vào Settings > Secrets and variables > Actions của repo,
# thêm 2 secret: SUPABASE_URL và SUPABASE_KEY (service_role key).

name: Daily Stock Data Update

on:
  schedule:
    # 10:30 UTC = 17:30 giờ VN (UTC+7), sau khi phiên đóng cửa + có dữ liệu.
    # Chỉ chạy các ngày trong tuần (thị trường VN nghỉ T7, CN).
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}  # cho phép bấm chạy tay từ tab Actions trên GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install vnstock supabase pandas pytz

      - name: Run daily update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python daily_update.py
        # Thêm vào cuối daily_update.yml hiện có:
      - name: 🤖 Run Ichimoku Alert Bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_ichimoku_alert.py
