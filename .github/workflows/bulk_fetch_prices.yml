name: Nạp giá TCBS vào Supabase

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 09:30 UTC = 16:30 giờ VN, sau khi đóng cửa 15:00, thứ 2-6
  workflow_dispatch:
    inputs:
      backfill:
        description: "Nạp lịch sử dài (420 ngày) - dùng lần đầu"
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests supabase
      - name: Chạy bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TCBS_RATE_LIMIT: "100"
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python bulk_fetch_prices.py --backfill
          else
            python bulk_fetch_prices.py
          fi
