name: Bơm Cache Giá Cổ Phiếu (Bulk Fetch)

on:
  schedule:
    - cron: '17 10 * * 1-5'  # 17h17 giờ VN (UTC+7), Thứ 2 - Thứ 6 (lệch phút để GitHub ít bỏ lỡ)
    - cron: '47 11 * * 1-5'  # 18h47 giờ VN: chạy lần 2 phòng nguồn chậm cập nhật
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Tải lại TOÀN BỘ lịch sử từ TCBS/DNSE (1 = có, 0 = không)'
        default: '0'
      universe:
        description: 'existing = các mã đang có trong CSV, hose = toàn bộ mã HOSE'
        default: 'existing'

permissions:
  contents: write

jobs:
  bulk-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo code về
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase

      - name: Chạy bot cào dữ liệu -> ghi ra data/stock_prices.csv
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FORCE_REBUILD: ${{ github.event.inputs.rebuild || '0' }}
          UNIVERSE: ${{ github.event.inputs.universe || 'existing' }}
        run: python bulk_fetch_prices_v2.py

      - name: Tự commit file data/stock_prices.csv ngược lại repo
        if: always()   # vẫn commit phần đã lấy được kể cả khi bước trên báo đỏ
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update stock_prices.csv"
          file_pattern: "data/stock_prices.csv"
