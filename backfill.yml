# Đặt file này vào: <repo>/.github/workflows/backfill.yml
#
# Đây là workflow CHẠY TAY 1 LẦN (không tự động theo lịch) — dùng cho việc
# nạp dữ liệu ban đầu cho 1498 mã. Sau khi chạy xong, dùng daily_update.yml
# (chạy tự động mỗi ngày) để cập nhật tiếp.
#
# Trước khi chạy: vào Settings > Secrets and variables > Actions của repo,
# thêm 2 secret: SUPABASE_URL và SUPABASE_KEY (service_role key).

name: One-time Backfill

on:
  workflow_dispatch: {}  # chỉ chạy khi bạn tự bấm nút "Run workflow" trên tab Actions

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # backfill 1498 mã có thể mất 80-120 phút, để dư giờ

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install vnstock supabase pandas pytz

      - name: Run backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python backfill_supabase.py

      # Lưu lại file tiến độ + log lỗi để nếu job bị timeout/ngắt giữa chừng,
      # bạn có thể tải về xem đã chạy tới đâu (dù rerun sẽ tự query Supabase
      # để biết mã nào đã có dữ liệu, không phụ thuộc hoàn toàn vào file này
      # vì mỗi lần chạy workflow là 1 máy ảo mới, không giữ file cũ).
      - name: Upload progress artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-progress
          path: |
            backfill_progress.txt
            backfill_errors.log
          if-no-files-found: ignore
