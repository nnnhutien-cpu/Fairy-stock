# Đặt file này tại: .github/workflows/scan_screener.yml
#
# Chạy tự động sau giờ đóng cửa (15:30 giờ VN = UTC+7 -> 08:30 UTC), thứ 2-6.
# Có thể bấm "Run workflow" thủ công trong tab Actions để quét ngay bất cứ lúc nào.

name: Quét Bộ Lọc -> Cache Excel

on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r requirements.txt openpyxl

      - name: Chạy quét toàn sàn
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python bulk_scan_screener.py

      - name: Commit screener_cache.xlsx vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screener_cache.xlsx
          git diff --quiet --cached || git commit -m "Cập nhật screener_cache.xlsx $(date +'%Y-%m-%d %H:%M')"
          git push
